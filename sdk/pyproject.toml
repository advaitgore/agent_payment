[project]
name = "agent-payment"
version = "0.1.0"
description = "Python SDK for the AgentPay authorization API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["httpx>=0.27.0"]

[project.urls]
Homepage = "https://github.com/advaitgore/agent_payment"
Repository = "https://github.com/advaitgore/agent_payment"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
